name: Build Typst document
on: [push]
jobs:
  build_typst:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile Typst document
        uses: ammar-ahmed22/compile-typst-action@v2
        with:
          source_paths: main.typ
          output_paths: rh-resume.pdf

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: rh-resume.pdf

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest resume
          # prerelease: true
          files: rh-resume.pdf
